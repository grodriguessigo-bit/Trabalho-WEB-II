<div class="container">

  <div class="col-md-12">

    <h1>Editar Funcionário</h1>

    <div class="well">

      <form #formEmployee="ngForm">

        <div class="form-group row">
          <label for="name" class="col-md-2 control-label">Nome:</label>

          <div class="col-md-6">
            <input type="text" class="form-control" id="name" name="name"
            [(ngModel)]="employee.name" #name="ngModel" required>

            @if (name.errors && (name.dirty || name.touched)) {
              <div class="alert alert-danger">
                <div [hidden]="!name.errors['required']">
                  Digite o nome do funcionário.
                </div>
              </div>
            }
          </div>
        </div>

        <div class="form-group row">
          <label for="email" class="col-md-2 control-label">E-mail:</label>

          <div class="col-md-6">
            <input type="email" class="form-control" id="email" name="email"
            [(ngModel)]="employee.email" #email="ngModel" required>

            @if (email.errors && (email.dirty || email.touched)) {
              <div class="alert alert-danger">
                <div [hidden]="!email.errors['required']">
                  Digite o e-mail do funcionário.
                </div>
              </div>
            }
          </div>
        </div>

        <div class="form-group row">
          <label for="birthDate" class="col-md-2 control-label">Data de Nascimento:</label>

          <div class="col-md-4">
            <input type="date" class="form-control" id="birthDate" name="birthDate"
            [(ngModel)]="employee.birthDate" #birthDate="ngModel" required>
          </div>
        </div>

        <div class="form-group row">
          <label for="password" class="col-md-2 control-label">Senha:</label>

          <div class="col-md-4">
            <input type="password" class="form-control" id="password" name="password"
            [(ngModel)]="employee.password" #password="ngModel" required>
          </div>
        </div>

        @if (message) {
          <div class="row">
            <div class="col-md-6 col-md-offset-2">
              <div class="alert alert-danger">
                {{ message }}
              </div>
            </div>
          </div>
        }

        <div class="form-group row">
          <div class="col-md-6 col-md-offset-2">

            <button type="button" class="btn btn-primary"
            (click)="update()" [disabled]="!formEmployee.form.valid">
              Salvar
            </button>

            <a class="btn btn-default" [routerLink]="['/employee/list']">
              Voltar
            </a>

          </div>
        </div>

      </form>

    </div>

  </div>

</div>
