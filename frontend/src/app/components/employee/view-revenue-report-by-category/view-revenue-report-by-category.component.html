<div class="container">

  <div class="col-md-12">

    <h1>
      Relatório de Receitas por Categoria
    </h1>

    <div class="form-group row">

      <label
        for="category"
        class="col-md-2 control-label">

        Categoria:

      </label>

      <div class="col-md-6">

        <select
          id="category"
          name="category"
          class="form-control"
          [(ngModel)]="selectedCategoryId">

          <option [ngValue]="null">
            Selecione uma categoria
          </option>

          @for (category of categories; track category.id) {

            <option [ngValue]="category.id">
              {{ category.name }}
            </option>

          }

        </select>

      </div>

    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="filterReport()">

      Filtrar

    </button>

    @if (message) {

      <div class="alert alert-info">
        {{ message }}
      </div>

    }

    @if (showResult) {

      <div class="mt-3">

        <h2>
          Resultado
        </h2>

        <p>
          <strong>
            Solicitações pagas:
          </strong>

          {{ requestsCount }}
        </p>

        <p>
          <strong>
            Receita total:
          </strong>

          {{ totalRevenue | currency:'BRL' }}
        </p>

      </div>

    }

    <a
      class="btn btn-default"
      [routerLink]="['/employee/home']">

      Voltar

    </a>

  </div>

</div>
