<form
  id="repair-form"
  class="repair-form"
  #formRepair="ngForm"
  (ngSubmit)="createRequest()"
>
  <h1 class="repair-form__title">Cadastrar novo reparo</h1>

  <label class="repair-form__label" for="description">
    Descrição do equipamento:
  </label>

  <input
    type="text"
    class="repair-form__control"
    id="description"
    name="description"
    maxlength="30"
    [(ngModel)]="request.equipmentDescription"
    #description="ngModel"
    required
  >

  @if (description.invalid && (description.dirty || description.touched)) {
    <div class="alert alert-danger">
      Digite a descrição do equipamento.
    </div>
  }

  <label class="repair-form__label" for="DescriptionDefect">
    Descrição do defeito:
  </label>

  <input
    type="text"
    class="repair-form__control"
    id="DescriptionDefect"
    name="DescriptionDefect"
    [(ngModel)]="request.defectDescription"
    #defect="ngModel"
    required
  >

  @if (defect.invalid && (defect.dirty || defect.touched)) {
    <div class="alert alert-danger">
      Digite a descrição do defeito.
    </div>
  }

  <label class="repair-form__label" for="equipamentCategory">
    Categoria do equipamento:
  </label>

  <select
    class="repair-form__controlSelect"
    id="equipamentCategory"
    name="equipamentCategory"
    [(ngModel)]="request.categoryId"
    required
  >
    <option [ngValue]="0" disabled>
      Selecione uma categoria
    </option>

    @for (cat of equipmentCategories(); track cat.id) {
      <option [ngValue]="cat.id">
        {{ cat.name }}
      </option>
    }
  </select>

  @if (message()) {
    <div class="alert alert-danger" role="alert">
      {{ message() }}
    </div>
  }

  <button
    type="submit"
    class="repair-form__buttton"
    [disabled]="formRepair.invalid || !request.categoryId || saving()"
  >
    {{ saving() ? 'Cadastrando...' : 'Cadastrar' }}
  </button>

  <button
    type="button"
    class="repair-form__buttton"
    (click)="goBack()"
  >
    Voltar
  </button>
</form>
