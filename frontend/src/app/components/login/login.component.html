<div class="container">

  <div class="col-md-12">

    <h1>Login</h1>

    <div class="well">

      <form>

        <div class="form-group row">
          <label for="email" class="col-md-2 control-label">E-mail:</label>

          <div class="col-md-4">
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email">
          </div>
        </div>

        <div class="form-group row">
          <label for="password" class="col-md-2 control-label">Senha:</label>

          <div class="col-md-4">
            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
          </div>
        </div>

        @if (message) {
          <div class="row">
            <div class="col-md-4 col-md-offset-2">
              <div class="alert alert-danger"> {{ message }} </div>
            </div>
          </div>
        }

        <div class="form-group row">
          <div class="col-md-4 col-md-offset-2">

            <button type="button" class="btn btn-primary" (click)="login()">
              <i class="fa fa-sign-in"></i> Entrar
            </button>

            <a class="btn btn-default" [routerLink]="['/client/register']">
              <i class="fa fa-user-plus"></i> Cadastrar-se
            </a>

          </div>
        </div>

      </form>

    </div>

  </div>

</div>
